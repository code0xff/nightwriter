<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nightwriter — agent generator</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash (default: dark).
      try {
        var t = localStorage.getItem("nw_theme");
        document.documentElement.classList.toggle("dark", t ? t === "dark" : true);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
